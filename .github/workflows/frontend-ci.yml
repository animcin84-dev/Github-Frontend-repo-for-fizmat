name: frontend-ci

on:
  push:
    branches: [main, "feat/phase-d-ai-quality", "feat/phase-e-controlled-automation", "feat/phase-f2-real-gmail-data-plane", "feat/hackathon-whatsapp", "feat/p2a-real-ai-triage"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/support_intelligence
      SUPPORT_DATA_MODE: mock
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      HF_TOKEN: ""
      GMAIL_TOKEN_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      GMAIL_OAUTH_STATE_SECRET: phase-f2-ci-state-secret-not-production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d support_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Show verified commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        shell: bash
        run: |
          set +e
          npm audit --json | tee npm-audit.json
          audit_code=${PIPESTATUS[0]}
          echo "npm_audit_exit_code=${audit_code}"
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities ?? {}; console.log(`audit_summary total=${v.total ?? 0} critical=${v.critical ?? 0} high=${v.high ?? 0} moderate=${v.moderate ?? 0} low=${v.low ?? 0}`)'
          exit 0
      - name: Check database migrations
        run: npm run db:check
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run server/domain tests
        run: npm run test:server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Run accessibility gate
        run: npm run test:a11y
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            playwright-report
            test-results
            npm-audit.json
          if-no-files-found: ignore
          retention-days: 7
