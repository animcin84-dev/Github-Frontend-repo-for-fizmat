name: frontend-ci

on:
  push:
    branches: [main, "feat/phase-d-ai-quality", "feat/phase-e-controlled-automation"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show verified commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        shell: bash
        run: |
          set +e
          npm audit --json | tee npm-audit.json
          audit_code=${PIPESTATUS[0]}
          echo "npm_audit_exit_code=${audit_code}"
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities ?? {}; console.log(`audit_summary total=${v.total ?? 0} critical=${v.critical ?? 0} high=${v.high ?? 0} moderate=${v.moderate ?? 0} low=${v.low ?? 0}`)'
          exit 0
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Run accessibility gate
        run: npm run test:a11y
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            playwright-report
            test-results
            npm-audit.json
          if-no-files-found: ignore
          retention-days: 7
