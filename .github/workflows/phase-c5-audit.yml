name: phase-c5-audit

on:
  push:
    branches: ["feat/phase-d-ai-quality"]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test non-breaking braces patch override
        shell: bash
        run: |
          npm pkg set overrides.braces=3.0.4
          npm install --package-lock-only --ignore-scripts
          echo "=== PACKAGE DIFF ==="
          git diff -- package.json package-lock.json
          echo "=== AUDIT AFTER PATCH OVERRIDE ==="
          set +e
          npm audit --json
          echo "npm_audit_exit_code=$?"
          exit 0
