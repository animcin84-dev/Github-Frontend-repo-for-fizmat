name: phase-a-bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/phase-a.tgz.b64"
      - ".github/workflows/phase-a-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract Phase A project
        shell: bash
        run: |
          git show c1badb86a251520f6d72a740efc0bc21d1c8909c:.bootstrap/phase-a.tgz.b64 > /tmp/phase-a.tgz.b64
          base64 -d /tmp/phase-a.tgz.b64 > /tmp/phase-a.tgz
          tar -xzf /tmp/phase-a.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/phase-a-bootstrap.yml
          cat > postcss.config.mjs <<'EOF'
          const config = {
            plugins: {
              "@tailwindcss/postcss": {},
            },
          };

          export default config;
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path("src/components/app-shell/theme-toggle.tsx")
          s = p.read_text()
          s = s.replace('    setDark(initial);\n', '')
          s = s.replace('    const next = !dark;\n', '    const current = document.documentElement.dataset.theme === "dark";\n    const next = !current;\n')
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified Phase A
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Phase A frontend foundation"
          git push origin HEAD:main
