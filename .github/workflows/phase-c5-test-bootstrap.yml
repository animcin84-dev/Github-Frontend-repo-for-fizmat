name: phase-c5-test-bootstrap

on:
  push:
    branches: ["feat/phase-d-ai-quality"]
    paths:
      - ".github/workflows/phase-c5-test-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-d-ai-quality
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add Playwright and axe dependencies
        run: npm install --save-dev @playwright/test @axe-core/playwright
      - name: Commit dependency lock update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "test: add Playwright and axe browser dependencies"
          git push origin HEAD:feat/phase-d-ai-quality
