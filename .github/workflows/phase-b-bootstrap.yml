name: phase-b-bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-b-bootstrap.yml"

permissions:
  contents: write

jobs:
  phase-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase B delta
        shell: bash
        run: |
          cat .bootstrap/phase-b.part.* > /tmp/phase-b.tgz.b64
          test "$(wc -c < /tmp/phase-b.tgz.b64)" -eq 20560
          base64 -d /tmp/phase-b.tgz.b64 > /tmp/phase-b.tgz
          tar -tzf /tmp/phase-b.tgz >/dev/null
          tar -xzf /tmp/phase-b.tgz -C .
          python - <<'PY'
          from pathlib import Path
          p = Path("src/components/inbox/inbox-workspace.tsx")
          s = p.read_text()

          virtualizer = '  const virtualizer = useVirtualizer({ count: items.length, getScrollElement: () => parentRef.current, estimateSize: () => 76, overscan: 12 });'
          assert s.count(virtualizer) == 1
          s = s.replace(
              virtualizer,
              '  // TanStack Virtual intentionally returns imperative helpers; React Compiler skips memoizing this hook.\n'
              '  // eslint-disable-next-line react-hooks/incompatible-library\n'
              + virtualizer,
              1,
          )

          workspace_component = '''function ConversationWorkspace({ detail, showInspector }: { detail: ConversationDetail; showInspector: boolean }) {
            const [draftText, setDraftText] = useState(detail.aiDraft?.text ?? "");
            const [actionState, setActionState] = useState("");

            return <Group orientation="horizontal" className="h-full">
              <Panel id="thread" minSize="420px"><ThreadPanel detail={detail} /></Panel>
              {showInspector ? <>
                <Separator className="w-1 bg-[var(--border)] transition-colors hover:bg-[var(--accent)] focus-visible:bg-[var(--accent)]" />
                <Panel id="inspector" defaultSize="390px" minSize="340px" maxSize="460px" groupResizeBehavior="preserve-pixel-size">
                  <EvidenceInspector detail={detail} draftText={draftText} setDraftText={setDraftText} actionState={actionState} setActionState={setActionState} />
                </Panel>
              </> : null}
            </Group>;
          }

          '''
          anchor = 'export function InboxWorkspace({ initialConversationId }: { initialConversationId?: string }) {'
          assert s.count(anchor) == 1
          s = s.replace(anchor, workspace_component + anchor, 1)

          draft_state = '''  const [draftText, setDraftText] = useState("");
            const [actionState, setActionState] = useState("");

          '''
          assert s.count(draft_state) == 1
          s = s.replace(draft_state, "", 1)

          reset_effect = '''  useEffect(() => {
            if (detailQuery.data?.aiDraft) setDraftText(detailQuery.data.aiDraft.text);
            setActionState("");
          }, [detailQuery.data]);

          '''
          assert s.count(reset_effect) == 1
          s = s.replace(reset_effect, "", 1)

          old_workspace = '    <Panel id="workspace" minSize="420px"><div className="h-full">{detail ? <Group orientation="horizontal" className="h-full"><Panel id="thread" minSize="420px"><ThreadPanel detail={detail} /></Panel>{flags.showInspector ? <><Separator className="w-1 bg-[var(--border)] transition-colors hover:bg-[var(--accent)] focus-visible:bg-[var(--accent)]" /><Panel id="inspector" defaultSize="390px" minSize="340px" maxSize="460px" groupResizeBehavior="preserve-pixel-size"><EvidenceInspector detail={detail} draftText={draftText} setDraftText={setDraftText} actionState={actionState} setActionState={setActionState} /></Panel></> : null}</Group> : <LoadingState label="Loading conversation detail…" />}</div></Panel>'
          new_workspace = '    <Panel id="workspace" minSize="420px"><div className="h-full">{detail ? <ConversationWorkspace key={detail.id} detail={detail} showInspector={flags.showInspector} /> : <LoadingState label="Loading conversation detail…" />}</div></Panel>'
          assert s.count(old_workspace) == 1
          s = s.replace(old_workspace, new_workspace, 1)

          p.write_text(s)
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/phase-b-bootstrap.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified Phase B
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Phase B golden path"
          git push origin HEAD:main
