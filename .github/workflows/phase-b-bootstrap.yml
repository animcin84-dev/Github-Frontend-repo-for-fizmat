name: phase-b-bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-b-bootstrap.yml"

permissions:
  contents: write

jobs:
  phase-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase B delta
        shell: bash
        run: |
          cat .bootstrap/phase-b.part.* > /tmp/phase-b.tgz.b64
          test "$(wc -c < /tmp/phase-b.tgz.b64)" -eq 20560
          base64 -d /tmp/phase-b.tgz.b64 > /tmp/phase-b.tgz
          tar -tzf /tmp/phase-b.tgz >/dev/null
          tar -xzf /tmp/phase-b.tgz -C .
          python - <<'PY'
          from pathlib import Path

          p = Path("src/components/inbox/inbox-workspace.tsx")
          lines = p.read_text().splitlines()
          out = []
          i = 0
          inserted = False
          replaced_workspace = False
          while i < len(lines):
              line = lines[i]
              if line == '  const virtualizer = useVirtualizer({ count: items.length, getScrollElement: () => parentRef.current, estimateSize: () => 76, overscan: 12 });':
                  out.append('  // TanStack Virtual intentionally returns imperative helpers; React Compiler skips memoizing this hook.')
                  out.append('  // eslint-disable-next-line react-hooks/incompatible-library')
                  out.append(line)
                  i += 1
                  continue
              if line == 'export function InboxWorkspace({ initialConversationId }: { initialConversationId?: string }) {':
                  out.extend([
                      'function ConversationWorkspace({ detail, showInspector }: { detail: ConversationDetail; showInspector: boolean }) {',
                      '  const [draftText, setDraftText] = useState(detail.aiDraft?.text ?? "");',
                      '  const [actionState, setActionState] = useState("");',
                      '',
                      '  return <Group orientation="horizontal" className="h-full">',
                      '    <Panel id="thread" minSize="420px"><ThreadPanel detail={detail} /></Panel>',
                      '    {showInspector ? <>',
                      '      <Separator className="w-1 bg-[var(--border)] transition-colors hover:bg-[var(--accent)] focus-visible:bg-[var(--accent)]" />',
                      '      <Panel id="inspector" defaultSize="390px" minSize="340px" maxSize="460px" groupResizeBehavior="preserve-pixel-size">',
                      '        <EvidenceInspector detail={detail} draftText={draftText} setDraftText={setDraftText} actionState={actionState} setActionState={setActionState} />',
                      '      </Panel>',
                      '    </> : null}',
                      '  </Group>;',
                      '}',
                      '',
                  ])
                  inserted = True
                  out.append(line)
                  i += 1
                  continue
              if line in {'  const [draftText, setDraftText] = useState("");', '  const [actionState, setActionState] = useState("");'}:
                  i += 1
                  continue
              if line == '  useEffect(() => {' and i + 1 < len(lines) and 'detailQuery.data?.aiDraft' in lines[i + 1]:
                  i += 4
                  continue
              if line.startswith('    <Panel id="workspace" minSize="420px"><div className="h-full">{detail ? <Group orientation="horizontal"'):
                  out.append('    <Panel id="workspace" minSize="420px"><div className="h-full">{detail ? <ConversationWorkspace key={detail.id} detail={detail} showInspector={flags.showInspector} /> : <LoadingState label="Loading conversation detail…" />}</div></Panel>')
                  replaced_workspace = True
                  i += 1
                  continue
              out.append(line)
              i += 1
          assert inserted and replaced_workspace
          p.write_text("\n".join(out) + "\n")

          Path("src/app/(product)/inbox/page.tsx").write_text(
              'import { Suspense } from "react";\n'
              'import { InboxWorkspace } from "@/components/inbox/inbox-workspace";\n'
              'import { LoadingState } from "@/components/ui/page-state";\n\n'
              'export default function InboxPage() {\n'
              '  return <Suspense fallback={<LoadingState label="Loading inbox…" />}><InboxWorkspace /></Suspense>;\n'
              '}\n'
          )

          Path("src/app/(product)/inbox/[conversationId]/page.tsx").write_text(
              'import { Suspense } from "react";\n'
              'import { InboxWorkspace } from "@/components/inbox/inbox-workspace";\n'
              'import { LoadingState } from "@/components/ui/page-state";\n\n'
              'export default async function ConversationPage({ params }: { params: Promise<{ conversationId: string }> }) {\n'
              '  const { conversationId } = await params;\n'
              '  return <Suspense fallback={<LoadingState label="Loading conversation…" />}><InboxWorkspace initialConversationId={conversationId} /></Suspense>;\n'
              '}\n'
          )
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/phase-b-bootstrap.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified Phase B
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Phase B golden path"
          git push origin HEAD:main
